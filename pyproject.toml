[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snas-code"
version = "1.0.0"
authors = [
    { name = "Peeyush", email = "peeyush@example.com" }
]
description = "SANS CODE: Systemic Neural Agentic Solutions - An open-source global terminal agentic CLI for software engineering"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
]
dependencies = [
    "ollama>=0.2.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
]

[project.scripts]
snas = "snas_code.main:main"
snas-code = "snas_code.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snas_code*"]
